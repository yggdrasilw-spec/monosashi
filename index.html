<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>長さの学習アプリ（cm・mm対応／拡大縮小対応）</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --panel:rgba(255,255,255,.88);
      --ink:#1f2937;
      --muted:#64748b;
      --cm:#ef4444;
      --mm:#2563eb;
      --good:#16a34a;
      --shadow:0 18px 50px rgba(15,23,42,.12);
      --zoom:0.2;
      --canvas-w:6500px;
      --canvas-h:1400px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
      background:radial-gradient(circle at top, #fff 0%, var(--bg) 62%, #e8eefc 100%);
      color:var(--ink);
      -webkit-tap-highlight-color:transparent;
    }
    .app{
      height:100vh;
      padding:14px;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:12px;
    }
    .topbar,.bottombar,.stage{
      background:var(--panel);
      border:1px solid rgba(148,163,184,.25);
      border-radius:24px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    .topbar{
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .title h1{margin:0;font-size:22px;line-height:1.15}
    .title .sub{font-size:14px;color:var(--muted);margin-top:4px}
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
      justify-content:flex-end;
    }
    button,.switch,.pill{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
      font-weight:800;
      user-select:none;
    }
    #soundBtn{
      min-width:56px;
      padding:10px 12px;
      font-size:20px;
      line-height:1;
    }
    #soundBtn.sound-on{
      background:#dbeafe;
      color:#2563eb;
    }
    #soundBtn.sound-off{
      background:#e5e7eb;
      color:#94a3b8;
      filter:saturate(.4);
    }
    button{
      background:#e5e7eb;
      color:#111827;
      cursor:pointer;
    }
    button.primary{background:#2563eb;color:#fff}
    button.good{background:var(--good);color:#fff}
    button.ghost{background:#eff6ff;color:#1d4ed8}
    button:active{transform:translateY(1px)}
    .switch{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#eef2ff;
      color:#1e293b;
      cursor:pointer;
      white-space:nowrap;
    }
    .switch input{transform:scale(1.15)}

    .stage{
      position:relative;
      overflow:auto;
      min-height:420px;
      scrollbar-gutter:stable both-edges;
    }
    .stage-viewport{
      position:relative;
      width:100%;
      height:100%;
    }
    .stage-spacer{
      width:var(--canvas-w);
      height:var(--canvas-h);
      pointer-events:none;
    }
    .stage-surface{
      position:absolute;
      left:0;
      top:0;
      width:var(--canvas-w);
      height:var(--canvas-h);
      transform:scale(var(--zoom));
      transform-origin:top left;
      will-change:transform;
    }
    .zoom-indicator{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:84px;
      background:#fff;
      color:#0f172a;
      border:1px solid rgba(148,163,184,.22);
    }

    .floating-note{
      position:absolute;
      right:18px;
      top:14px;
      background:rgba(255,255,255,.90);
      border:1px solid rgba(148,163,184,.25);
      border-radius:14px;
      padding:10px 12px;
      font-size:13px;
      color:#334155;
      box-shadow:0 10px 24px rgba(0,0,0,.08);
      max-width:min(430px,46vw);
      z-index:18;
      pointer-events:none;
    }

    .object-wrap{
      cursor:grab;
      position:absolute;
      left:760px;
      top:170px;
      width:1320px;
      height:320px;
      z-index:8;
      user-select:none;
      touch-action:none;
      filter:drop-shadow(0 12px 20px rgba(15,23,42,.15));
    }
    .object-wrap.dragging{cursor:grabbing}
    .object-wrap .label{
      position:absolute;
      left:0;
      top:-38px;
      padding:6px 12px;
      border-radius:999px;
      background:rgba(17,24,39,.90);
      color:#fff;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
      pointer-events:none;
    }
    .eraser-object{
      position:absolute;
      inset:0;
      display:block;
    }
    .eraser-body{
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,#fdfdfd 0%,#f1f1f1 100%);
      border:2px solid rgba(0,0,0,.10);
      border-radius:18px 8px 8px 18px;
      overflow:hidden;
    }
    .eraser-cap{
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:16%;
      background:linear-gradient(90deg,#f8fafc,#e5e7eb);
      border-right:2px solid rgba(0,0,0,.08);
    }
    .eraser-top{
      position:absolute;
      left:16%;
      right:0;
      top:0;
      height:34%;
      background:linear-gradient(180deg,#3557a8,#294c97);
    }
    .eraser-mid{
      position:absolute;
      left:16%;
      right:0;
      top:34%;
      height:36%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:42px;
      font-weight:900;
      letter-spacing:.08em;
      color:#171717;
    }
    .eraser-bottom{
      position:absolute;
      left:16%;
      right:0;
      bottom:0;
      height:30%;
      background:#111827;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:800;
      font-size:18px;
      letter-spacing:.05em;
    }

    .pencil-svg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      overflow:visible;
    }
    .custom-image-object{
      position:absolute;
      inset:0;
      display:block;
    }
    .custom-image-object img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .ruler-wrap{
      position:absolute;
      left:220px;
      top:540px;
      width:5100px;
      height:303px;
      cursor:grab;
      touch-action:none;
      user-select:none;
      z-index:15;
      will-change:transform,left,top;
    }
    .ruler-wrap.dragging{cursor:grabbing}
    .ruler-svg{
      width:100%;
      height:100%;
      display:block;
      filter:drop-shadow(0 10px 18px rgba(15,23,42,.12));
    }

    .hint-badge,.toast{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      border-radius:18px;
      font-weight:900;
      pointer-events:none;
      z-index:30;
      box-shadow:0 18px 40px rgba(0,0,0,.18);
    }
    .hint-badge{
      top:18px;
      background:rgba(17,24,39,.9);
      color:#fff;
      padding:10px 16px;
      font-size:15px;
      opacity:0;
      transition:opacity .22s ease, transform .22s ease;
    }
    .hint-badge.show{opacity:1;transform:translateX(-50%) translateY(2px)}
    .toast{
      bottom:26px;
      background:rgba(17,24,39,.93);
      color:#fff;
      padding:14px 18px;
      font-size:16px;
      opacity:0;
      transition:opacity .22s ease, transform .22s ease;
      max-width:min(90vw,760px);
      text-align:center;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .overlay{
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:22;
    }

    .bottombar{padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
    #debugPanel{display:none;flex-wrap:wrap;gap:8px;align-items:center;width:100%;}
    #debugPanel.visible{display:flex;}
    #debugBtn{
      font-size:11px;
      padding:6px 10px;
      background:#f1f5f9;
      color:#64748b;
      border:1px solid #cbd5e1;
      border-radius:999px;
      cursor:pointer;
      font-weight:700;
      flex-shrink:0;
    }
    #debugBtn.active{background:#fef3c7;color:#92400e;border-color:#fcd34d;}
    .result{
      font-size:22px;
      font-weight:900;
      line-height:1.4;
      flex:1;
    }
    .result .cm{color:var(--cm);font-weight:900}
    .result .mm{color:var(--mm);font-weight:900}
    .status-row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .status-left{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#eef2ff;
      border:1px solid rgba(37,99,235,.12);
      font-size:14px;
      font-weight:700;
    }
    .pill b{font-size:15px}
    .footer-note{
      margin-top:8px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:13px;
    }
    .small{color:var(--muted);font-size:13px}
    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">
        <h1>長さの学習アプリ</h1>
        <div class="sub">物差しの「0」を対象物の左下に合わせて、cm と mm を読もう</div>
      </div>

      <div class="controls">
        <label class="switch"><input id="hintToggle" type="checkbox" checked> mm色分けヒント</label>
        <button id="newProblemBtn" class="ghost">次の問題</button>
        <span id="problemIdBadge" class="pill" style="background:#fef9c3;border:1px solid #ca8a04;color:#92400e;font-size:13px;">問題ID: 1</span>
        <button id="rerollPencilBtn" class="ghost">鉛筆を再生成</button>
        <button id="resetBtn">最初にもどす</button>
        <button id="zoomOutBtn">－</button>
        <div id="zoomText" class="pill zoom-indicator">拡大 20%</div>
        <button id="zoomInBtn">＋</button>
        <button id="zoomResetBtn">標準</button>
        <button id="modeBtn" class="ghost">通常測定モード</button>
        <button id="measureBtn" class="primary">測るアニメ開始</button>
        
<button id="imageLoadBtn">画像を読み込む</button>
<input id="imageInput" type="file" accept="image/*" style="display:none">
<button id="loadFolderBtn" title="同フォルダのPNGを問題ID4以降に自動追加">📁 PNGフォルダ読み込み</button>

        <button id="soundBtn" class="sound-off" aria-label="音声切り替え">🔊</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="stage-viewport" id="stageViewport">
        <div class="stage-spacer" id="stageSpacer"></div>
        <div class="stage-surface" id="stageSurface">
          <div class="floating-note">※物差しは 1mm = 17px の高精度設計です。拡大縮小しても目盛り位置は崩れません。</div>

          <div class="object-wrap" id="objectWrap" aria-label="測定対象物品">
            <div class="label" id="objectLabel">消しゴム</div>
            <div id="objectBody"></div>
          </div>

          <div class="ruler-wrap" id="rulerWrap" aria-label="竹物差し">
            <svg id="rulerSvg" class="ruler-svg" viewBox="0 0 5100 303" shape-rendering="geometricPrecision" preserveAspectRatio="none">
              <defs>
                <clipPath id="rulerClip">
                  <rect x="0" y="0" width="5100" height="303" rx="0" ry="0"></rect>
                </clipPath>
              </defs>
              <g id="rulerBody" fill="#f1ddb9" stroke="#2b1d18" stroke-width="2.4">
                <rect x="0" y="0" width="5100" height="303" />
                <line x1="0" y1="74" x2="5100" y2="74" />
                <line x1="0" y1="107" x2="5100" y2="107" />
                <line x1="0" y1="136" x2="5100" y2="136" />
              </g>

              <g id="hintLayer" clip-path="url(#rulerClip)"></g>
              <g id="mmTicks" stroke-linecap="square"></g>
              <g id="halfCmTicks" stroke="#2b1d18" stroke-width="2.4" stroke-linecap="square"></g>
              <g id="cmTicks" stroke="#2b1d18" stroke-width="2.4" stroke-linecap="square"></g>
              <g id="fiveCmDots"></g>
              <g id="tenCmMarkers" stroke="#2b1d18" stroke-width="2.4" stroke-linecap="round" fill="none"></g>
            </svg>
          </div>

          <svg id="measureOverlay" class="overlay" viewBox="0 0 6500 1400" preserveAspectRatio="none"></svg>

          
<div id="customImageWrap" style="
position:absolute;
left:340px;
top:110px;
display:none;
z-index:9;
user-select:none;
pointer-events:none;
">
  <img id="customImage" src="" style="
    display:block;
    max-height:180px;
    object-fit:contain;
  ">
</div>

        <div class="hint-badge" id="hintBadge">端と０を合わせたね！</div>
          <div class="toast" id="toast"></div>
        </div>
      </div>
    </div>

    <div class="bottombar">
      <button id="debugBtn">🔧 DEBUG</button>
      <div class="result" id="resultText"></div>
      <div id="debugPanel">
        <div class="pill">対象：<b id="objectText">消しゴム</b></div>
        <div class="pill">対象の長さ：<b id="lengthText">4cm 0mm</b></div>
        <div class="pill">物差しの位置：<b id="snapText">未スナップ</b></div>
        <div class="pill">状態：<b id="modeText">待機中</b></div>
        <div class="pill" style="color:var(--muted);font-size:12px;">ドラッグで移動 → 対象物の左下に近づくと吸い付きます</div>
        <div class="pill" style="color:var(--muted);font-size:12px;">5cmの黒点、10cmの赤点・4重円弧、0の区切り線、mm着色を精密に描画</div>
      </div>
    </div>
  </div>

  
<script>
(() => {
  const PX_PER_MM = 17;
  const RULER_MM = 300; // 30cm
  const RULER_HEIGHT = 303;
  const CANVAS_W = 6500;
  const CANVAS_H_BASE = 1400;  // 最小キャンバス高さ
  let CANVAS_H = CANVAS_H_BASE;

  const stage = document.getElementById('stage');
  const stageSpacer = document.getElementById('stageSpacer');
  const measureOverlay = document.getElementById('measureOverlay');
  const objectWrap = document.getElementById('objectWrap');
  const objectBody = document.getElementById('objectBody');
  const objectLabel = document.getElementById('objectLabel');
  const rulerWrap = document.getElementById('rulerWrap');
  const hintToggle = document.getElementById('hintToggle');
  const newProblemBtn = document.getElementById('newProblemBtn');
  const rerollPencilBtn = document.getElementById('rerollPencilBtn');
  const resetBtn = document.getElementById('resetBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');
  const zoomText = document.getElementById('zoomText');
  const modeBtn = document.getElementById('modeBtn');
  const measureBtn = document.getElementById('measureBtn');
  const imageLoadBtn = document.getElementById('imageLoadBtn');
  const imageInput = document.getElementById('imageInput');
  const soundBtn = document.getElementById('soundBtn');
  const hintBadge = document.getElementById('hintBadge');
  const toast = document.getElementById('toast');
  const resultText = document.getElementById('resultText');
  const objectText = document.getElementById('objectText');
  const lengthText = document.getElementById('lengthText');
  const snapText = document.getElementById('snapText');
  const modeText = document.getElementById('modeText');
  const mmTicksGroup = document.getElementById('mmTicks');
  const hintLayer = document.getElementById('hintLayer');
  const halfCmTicks = document.getElementById('halfCmTicks');
  const cmTicks = document.getElementById('cmTicks');
  const fiveCmDots = document.getElementById('fiveCmDots');
  const tenCmMarkers = document.getElementById('tenCmMarkers');

  const colorCycle = ['#f8b4d9','#bfdbfe','#bbf7d0','#fde68a','#ffffff'];
  const objectKinds = [
    { key: 'eraser', label: '消しゴム' },
    { key: 'pencil', label: '鉛筆' },
    { key: 'button', label: 'ボタン' }
  ];

  // ── 問題IDシステム ──────────────────────────────
  // 固定問題: ID1=消しゴム4cm, ID2=釦5mm, ID3=鉛筆8cm7mm
  const FIXED_PROBLEMS = [
    { type: 'eraser',  lengthMm: 40,  label: '消しゴム（4cm）' },
    { type: 'button',  lengthMm: 5,   label: '釦（5mm）' },
    { type: 'pencil',  lengthMm: 87,  label: '鉛筆（8cm7mm）' },
  ];

  // 同フォルダPNG管理
  const PNG_NAMES = ['candy','ika','kani','kutu1','kutu2','kabuto','sakana','kuwa','tombo'];
  let pngFileList = [];          // { name, src, ratio } の配列
  let currentProblemIndex = 0;   // 0始まり（ID1=index0）

  // 起動時：直書きPNGをfetchで自動読み込み
  async function preloadBuiltinPngs() {
    const results = await Promise.allSettled(
      PNG_NAMES.map(async name => {
        const res = await fetch(`./${name}.png`);
        if (!res.ok) throw new Error(`404: ${name}.png`);
        const blob = await res.blob();
        const file = new File([blob], `${name}.png`, { type: 'image/png' });
        const processed = await preprocessImageFile(file);
        return { name, src: processed.src, ratio: processed.ratio };
      })
    );
    pngFileList = results
      .filter(r => r.status === 'fulfilled')
      .map(r => r.value);
    return pngFileList.length;
  }

  // フォルダ選択でPNGを追加読み込み（直書き分に追記）
  async function loadFolderPngs() {
    if (!('showDirectoryPicker' in window)) return false;
    try {
      const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
      const entries = [];
      for await (const [name, handle] of dirHandle.entries()) {
        if (handle.kind === 'file' && /\.png$/i.test(name)) {
          entries.push({ name, handle });
        }
      }
      entries.sort((a, b) => a.name.localeCompare(b.name, 'ja'));

      const loaded = [];
      for (const { name, handle } of entries) {
        try {
          const file = await handle.getFile();
          const processed = await preprocessImageFile(file);
          loaded.push({ name, src: processed.src, ratio: processed.ratio });
        } catch (_) {}
      }
      // 既存リストを置き換え（フォルダ選択で上書き）
      pngFileList = loaded;
      return true;
    } catch (_) {
      return false;
    }
  }

  // 問題IDから実際の問題データを取得
  function getProblemById(id) {
    // 1始まり
    const fixedIdx = id - 1; // 0始まり
    if (fixedIdx < FIXED_PROBLEMS.length) {
      return { ...FIXED_PROBLEMS[fixedIdx], isFixed: true };
    }
    // PNG問題: ID4以降
    const pngIdx = fixedIdx - FIXED_PROBLEMS.length; // 0始まり
    if (pngFileList.length === 0) return null;
    const png = pngFileList[pngIdx % pngFileList.length];
    const minMm = 25, maxMm = 180;
    const lengthMm = minMm + Math.floor(Math.random() * (maxMm - minMm + 1));
    return {
      type: 'image',
      lengthMm,
      label: png.name.replace(/\.png$/i, ''),
      pngSrc: png.src,
      pngRatio: png.ratio,
      isFixed: false
    };
  }

  // 問題IDの最大値（固定3問＋PNG枚数）
  function maxProblemId() {
    return FIXED_PROBLEMS.length + pngFileList.length;
  }

  const problemIdBadge = document.getElementById('problemIdBadge');
  function updateProblemIdBadge(id) {
    if (problemIdBadge) problemIdBadge.textContent = `問題ID: ${id}`;
  }

  // 次の問題へ進む（問題IDを1つ上げて、末尾ならID1に戻る）
  function advanceToNextProblem() {
    const max = maxProblemId();
    if (max === 0) {
      // PNGなし・固定3問のみのとき
      currentProblemIndex = (currentProblemIndex + 1) % FIXED_PROBLEMS.length;
    } else {
      currentProblemIndex = (currentProblemIndex + 1) % max;
    }
    const id = currentProblemIndex + 1; // 1始まり
    const prob = getProblemById(id);
    if (!prob) {
      // PNG読み込み失敗等 → 固定1に戻す
      currentProblemIndex = 0;
      applyProblemById(1);
      return;
    }
    applyProblemById(id);
  }

  function applyProblemById(id) {
    const prob = getProblemById(id);
    if (!prob) return;
    updateProblemIdBadge(id);

    if (prob.type === 'image' && prob.pngSrc) {
      state.customImageSrc   = prob.pngSrc;
      state.customImageRatio = prob.pngRatio || 0.75;
    }

    const label = prob.label || formatObjectLabel(prob.type);
    setProblem(prob.type, prob.lengthMm, true, label);
    showToast(`問題ID ${id}：${label}`, 2000);
  }
  // ── /問題IDシステム ─────────────────────────────

  const state = {
    zoom: 0.2,
    audioEnabled: false,
    snapped: false,
    snapping: false,
    dragging: false,
    measuring: false,
    currentProblemId: 0,
    objectType: 'eraser',
    lengthMm: 40,
    objectX: 760,
    objectY: 170,
    objectW: 1320,
    objectH: 320,
    rulerLeft: 220,
    rulerTop: 540,
    snapLocked: false,
    snapSuspended: false,
    dragPointerId: null,
    dragStartClientX: 0,
    dragStartClientY: 0,
    dragStartLeft: 0,
    dragStartTop: 0,
    overlayToken: 0,
    measureMode: 'normal',
    objectDragging: false,
    objectDragPointerId: null,
    objectDragStartClientX: 0,
    objectDragStartClientY: 0,
    objectDragStartLeft: 0,
    objectDragStartTop: 0,
    customImageFit: null,
    customImageVisual: null
  };

  const audio = {
    context: null,
    ensure() {
      if (!this.context) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.context = new AC();
      }
      return this.context;
    }
  };

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function colorDistance(r1, g1, b1, r2, g2, b2) {
    return Math.sqrt(
      (r1 - r2) * (r1 - r2) +
      (g1 - g2) * (g1 - g2) +
      (b1 - b2) * (b1 - b2)
    );
  }

  function luminance(r, g, b) {
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  function sampleBorderBackground(imageData, width, height) {
    const samples = [];
    const step = Math.max(1, Math.floor(Math.min(width, height) / 120));

    function add(x, y) {
      const i = (y * width + x) * 4;
      const a = imageData[i + 3];
      if (a < 5) return;
      samples.push([imageData[i], imageData[i + 1], imageData[i + 2]]);
    }

    for (let x = 0; x < width; x += step) {
      add(x, 0);
      add(x, height - 1);
    }
    for (let y = 0; y < height; y += step) {
      add(0, y);
      add(width - 1, y);
    }

    if (!samples.length) return { r: 255, g: 255, b: 255 };

    let r = 0, g = 0, b = 0;
    for (const [sr, sg, sb] of samples) {
      r += sr; g += sg; b += sb;
    }
    return {
      r: r / samples.length,
      g: g / samples.length,
      b: b / samples.length
    };
  }

  function isBackgroundPixel(r, g, b, a, bg, threshold = 72) {
    if (a < 12) return true;
    const dist = colorDistance(r, g, b, bg.r, bg.g, bg.b);
    if (dist <= threshold) return true;
    return luminance(r, g, b) > 244 && dist <= threshold * 1.35;
  }

  async function preprocessImageFile(file) {
    const src = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('file-read-failed'));
      reader.onload = () => resolve(String(reader.result));
      reader.readAsDataURL(file);
    });

    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = () => reject(new Error('image-load-failed'));
      image.src = src;
    });

    const srcW = img.naturalWidth || 1;
    const srcH = img.naturalHeight || 1;

    const maxSide = 2400;
    const downScale = Math.min(1, maxSide / Math.max(srcW, srcH));

    const baseCanvas = document.createElement('canvas');
    baseCanvas.width = Math.max(1, Math.round(srcW * downScale));
    baseCanvas.height = Math.max(1, Math.round(srcH * downScale));

    const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });
    baseCtx.drawImage(img, 0, 0, baseCanvas.width, baseCanvas.height);

    const { width, height } = baseCanvas;
    const imageData = baseCtx.getImageData(0, 0, width, height).data;
    const bg = sampleBorderBackground(imageData, width, height);

    let minX = width, minY = height, maxX = -1, maxY = -1;

    const edgeMargin = Math.max(2, Math.round(Math.min(width, height) * 0.015));
    const localThreshold = 70;

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = (y * width + x) * 4;
        const r = imageData[i], g = imageData[i + 1], b = imageData[i + 2], a = imageData[i + 3];
        const isBg = isBackgroundPixel(r, g, b, a, bg, localThreshold);

        // Keep a bit more tolerance near the edges so border shadows are removed.
        const edgeBias = (x < edgeMargin || y < edgeMargin || x >= width - edgeMargin || y >= height - edgeMargin);
        if (!(isBg || (edgeBias && luminance(r, g, b) > 150 && colorDistance(r, g, b, bg.r, bg.g, bg.b) < 120))) {
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
    }

    let cropCanvas = baseCanvas;
    let cropRatio = baseCanvas.height / baseCanvas.width;

    if (maxX >= minX && maxY >= minY) {
      const padX = 0;
      const padY = 0;

      const x = Math.max(0, minX - padX);
      const y = Math.max(0, minY - padY);
      const w = Math.min(width - x, (maxX - minX + 1) + padX * 2);
      const h = Math.min(height - y, (maxY - minY + 1) + padY * 2);

      cropCanvas = document.createElement('canvas');
      cropCanvas.width = Math.max(1, w);
      cropCanvas.height = Math.max(1, h);

      const cropCtx = cropCanvas.getContext('2d');
      cropCtx.drawImage(baseCanvas, x, y, w, h, 0, 0, w, h);
      cropRatio = h / w;
    }

    const finalMaxSide = 1600;
    let finalCanvas = cropCanvas;
    if (Math.max(cropCanvas.width, cropCanvas.height) > finalMaxSide) {
      const s = finalMaxSide / Math.max(cropCanvas.width, cropCanvas.height);
      finalCanvas = document.createElement('canvas');
      finalCanvas.width = Math.max(1, Math.round(cropCanvas.width * s));
      finalCanvas.height = Math.max(1, Math.round(cropCanvas.height * s));
      const finalCtx = finalCanvas.getContext('2d');
      finalCtx.drawImage(cropCanvas, 0, 0, finalCanvas.width, finalCanvas.height);
    }

    return {
      src: finalCanvas.toDataURL('image/png'),
      width: finalCanvas.width,
      height: finalCanvas.height,
      ratio: cropRatio
    };
  }

  function showToast(msg, ms = 2200) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), ms);
  }

  function showHint(msg, ms = 3000) {
    hintBadge.textContent = msg;
    hintBadge.classList.add('show');
    clearTimeout(showHint._t);
    showHint._t = setTimeout(() => hintBadge.classList.remove('show'), ms);
  }

  function speak(text) {
    if (!state.audioEnabled || !('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 1.0;
    u.pitch = 1.05;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  function beep(freq = 760, duration = 100, type = 'triangle', gain = 0.045) {
    if (!state.audioEnabled) return;
    const ctx = audio.ensure();
    if (!ctx) return;
    if (ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.value = gain;
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    setTimeout(() => {
      try { osc.stop(); } catch (_) {}
    }, duration);
  }

  function fmtLength(mm) {
    const cm = Math.floor(mm / 10);

    return `${cm}cm ${rem}mm（${mm}mm）`;
  }

  function formatObjectLabel(type) {

  function updateZoomUI() {
    stage.style.setProperty('--zoom', String(state.zoom));

    stageSpacer.style.height = `${CANVAS_H * state.zoom}px`;

  // オブジェクトサイズに合わせてキャンバス高さとoverlayのviewBoxを動的に更新
  function updateCanvasSize() {
    // オブジェクト下端 + 物差し(303px) + 余白200px が収まるように
    const needed = state.objectY + state.objectH + RULER_HEIGHT + 200;
    CANVAS_H = Math.max(CANVAS_H_BASE, needed);

    // stage-surface と stageSpacer の高さを更新
    const stageSurface = document.getElementById('stageSurface');
    stageSurface.style.height = `${CANVAS_H}px`;
    stageSurface.style.setProperty('--canvas-h', `${CANVAS_H}px`);
    stageSpacer.style.height = `${CANVAS_H * state.zoom}px`;

    // measureOverlay の viewBox を更新（SVG座標系をキャンバスに合わせる）
    measureOverlay.setAttribute('viewBox', `0 0 ${CANVAS_W} ${CANVAS_H}`);
  }

  function updateSurfaceStatus() {
    objectText.textContent = state._customLabel || formatObjectLabel(state.objectType);
    lengthText.textContent = fmtLength(state.lengthMm);
    snapText.textContent = state.snapped ? 'スナップ中' : '未スナップ';

  function setResult(html) {

  }

  function mmColor(mm) {
    return colorCycle[mm % colorCycle.length];
  }

  function buildRulerSvg() {
    let hintHtml = '';
    for (let mm = 0; mm < RULER_MM; mm++) {
      const x = mm * PX_PER_MM + 2;
      const fill = mmColor(mm);
      /* 目盛り先端周辺だけ着色（高さ約4mm相当・不透明度100%） */
      hintHtml += `<rect
        x="${x}"
        y="0"
        width="${PX_PER_MM - 4}"
        height="68"
        fill="${fill}"
        opacity="1">
      </rect>`;
    }
    hintLayer.innerHTML = hintHtml;

    let mmHtml = '';
    mmHtml += `<line data-mm="0" x1="2" y1="0" x2="2" y2="58" stroke="#2b1d18" stroke-width="3.2" stroke-linecap="square"></line>`;
    for (let mm = 1; mm <= RULER_MM; mm++) {
      const x = mm * PX_PER_MM;
      const y2 = (mm % 10 === 0) ? 53 : (mm % 5 === 0 ? 44 : 36);
      const strokeWidth = (mm % 10 === 0) ? 2.8 : (mm % 5 === 0 ? 2.4 : 2.0);
      mmHtml += `<line data-mm="${mm}" x1="${x}" y1="0" x2="${x}" y2="${y2}" stroke="#2b1d18" stroke-width="${strokeWidth}" stroke-linecap="square"></line>`;
    }
    mmTicksGroup.innerHTML = mmHtml;

    let halfHtml = '';
    for (let mm = 5; mm < RULER_MM; mm += 10) {
      halfHtml += `<line x1="${mm * PX_PER_MM}" y1="53" x2="${mm * PX_PER_MM}" y2="74"></line>`;
    }
    halfCmTicks.innerHTML = halfHtml;

    let cmHtml = `<line x1="0.5" y1="53" x2="0.5" y2="107" stroke="#2b1d18" stroke-width="4.2" stroke-linecap="square"></line>`;
    for (let mm = 10; mm <= RULER_MM; mm += 10) {
      cmHtml += `<line x1="${mm * PX_PER_MM}" y1="53" x2="${mm * PX_PER_MM}" y2="107"></line>`;
    }
    cmTicks.innerHTML = cmHtml;

    let fiveCmHtml = '';
    [5, 15, 25].forEach(cm => {
      fiveCmHtml += `<circle cx="${cm * 10 * PX_PER_MM}" cy="136" r="9.5" fill="#111111" stroke="#2b1d18" stroke-width="2.4"></circle>`;

    fiveCmDots.innerHTML = fiveCmHtml;

    let tenCmHtml = '';
    [10, 20].forEach(cm => {
      const baseX = cm * 10 * PX_PER_MM;
      tenCmHtml += `
        <path d="M ${baseX - 18} 136 A 19 19 0 0 0 ${baseX + 18} 136"></path>
        <path d="M ${baseX - 30} 136 A 31 31 0 0 0 ${baseX + 30} 136"></path>
        <path d="M ${baseX - 42} 136 A 43 43 0 0 0 ${baseX + 42} 136"></path>
        <path d="M ${baseX - 54} 136 A 55 55 0 0 0 ${baseX + 54} 136"></path>
        <circle cx="${baseX - 58}" cy="136" r="9.5" fill="#f2171d" stroke="#2b1d18" stroke-width="2.4"></circle>
        <circle cx="${baseX}" cy="136" r="9.5" fill="#f2171d" stroke="#2b1d18" stroke-width="2.4"></circle>
        <circle cx="${baseX + 58}" cy="136" r="9.5" fill="#f2171d" stroke="#2b1d18" stroke-width="2.4"></circle>
        <circle cx="${baseX}" cy="172" r="9.5" fill="#f2171d" stroke="#2b1d18" stroke-width="2.4"></circle>
      `;
    });
    tenCmMarkers.innerHTML = tenCmHtml;
    applyHintToggle();
  }

  function applyHintToggle() {
    hintLayer.style.display = hintToggle.checked ? 'inline' : 'none';
  }

  function buildObjectSvg(type, lengthMm) {
    const lengthPx = lengthMm * PX_PER_MM;

    if (type === 'eraser') {
      state.objectW = lengthPx;
      state.objectH = 320;
      return `
        <div class="eraser-object" style="width:${lengthPx}px;height:${state.objectH}px;">
          <div class="eraser-body">
            <div class="eraser-cap"></div>
            <div class="eraser-top"></div>
            <div class="eraser-mid">MONO</div>
            <div class="eraser-bottom"><span>Tombow</span></div>
          </div>
        </div>
      `;
    }

    if (type === 'image') {
      state.objectW = lengthPx;
      state.objectH = Math.round(lengthPx * (state.customImageRatio || 0.75));
      const src = state.customImageSrc;
      const fitW = lengthPx;
      const fitH = state.objectH;
      const offsetX = 0;
      const offsetY = 0;
      state.customImageFit = { fitW, fitH, offsetX, offsetY };

      if (!src) {
        state.customImageVisual = null;
        return `
          <div class="custom-image-object" style="width:${lengthPx}px;height:${state.objectH}px;">
            <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;border:2px dashed rgba(37,99,235,.55);border-radius:18px;background:rgba(255,255,255,.72);font-weight:800;color:#1d4ed8;">
              画像を読み込んでください
            </div>
          </div>
        `;
      }
      state.customImageVisual = { x: 0, y: 0, w: lengthPx, h: state.objectH };
      return `
        <div class="custom-image-object" style="width:${lengthPx}px;height:${state.objectH}px;position:relative;overflow:hidden;">
          <img src="${src}" alt="読み込んだ画像" style="position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;display:block;">
        </div>
      `;
    }

    if (type === 'button') {
      state.objectW = lengthPx;
      state.objectH = 140;
      const r = Math.max(20, Math.round(lengthPx * 0.48));
      const cx = Math.round(lengthPx / 2);
      const cy = 70;
      return `
        <svg class="pencil-svg" viewBox="0 0 ${lengthPx} ${state.objectH}" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <radialGradient id="bGrad${state.currentProblemId}" cx="35%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#ffffff"></stop>
              <stop offset="55%" stop-color="#dbeafe"></stop>
              <stop offset="100%" stop-color="#60a5fa"></stop>
            </radialGradient>
            <linearGradient id="bShine${state.currentProblemId}" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(255,255,255,.85)"></stop>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
            </linearGradient>
          </defs>
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#bGrad${state.currentProblemId})" stroke="rgba(30,64,175,.28)" stroke-width="4"></circle>
          <circle cx="${cx - Math.max(10, r * 0.28)}" cy="${cy - Math.max(10, r * 0.25)}" r="${Math.max(8, r * 0.22)}" fill="url(#bShine${state.currentProblemId})" opacity=".85"></circle>
          <circle cx="${cx - r * 0.32}" cy="${cy - r * 0.16}" r="${Math.max(4, r * 0.11)}" fill="#1d4ed8"></circle>
          <circle cx="${cx + r * 0.14}" cy="${cy + r * 0.08}" r="${Math.max(4, r * 0.11)}" fill="#1d4ed8"></circle>
          <circle cx="${cx - r * 0.02}" cy="${cy + r * 0.30}" r="${Math.max(4, r * 0.11)}" fill="#1d4ed8"></circle>
          <text x="${cx}" y="${cy + r + 24}" text-anchor="middle" font-size="28" font-weight="900" fill="#1f2937">ボタン</text>
        </svg>
      `;
    }

    state.objectW = lengthPx;
    state.objectH = 180;
    const bodyStart = Math.max(120, Math.round(lengthPx * 0.14));
    const capStart = Math.max(bodyStart + 30, Math.round(lengthPx * 0.72));
    const tipEnd = 120;
    return `
      <svg class="pencil-svg" viewBox="0 0 ${lengthPx} ${state.objectH}" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="pBody${state.currentProblemId}" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f0c419"></stop>
            <stop offset="35%" stop-color="#ffd54a"></stop>
            <stop offset="100%" stop-color="#eab308"></stop>
          </linearGradient>
          <linearGradient id="pWood${state.currentProblemId}" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#deb887"></stop>
            <stop offset="100%" stop-color="#c89f6d"></stop>
          </linearGradient>
          <linearGradient id="pLead${state.currentProblemId}" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4b5563"></stop>
            <stop offset="100%" stop-color="#111827"></stop>
          </linearGradient>
        </defs>

        <polygon points="0,90 ${tipEnd},28 ${bodyStart},28 ${bodyStart},152 ${tipEnd},152" fill="url(#pWood${state.currentProblemId})" stroke="rgba(0,0,0,.14)" stroke-width="3"></polygon>
        <polygon points="0,90 72,50 72,130" fill="url(#pLead${state.currentProblemId})"></polygon>
        <polygon points="72,50 ${tipEnd},28 ${tipEnd},152 72,130" fill="#f5d0a0"></polygon>

        <rect x="${tipEnd}" y="28" width="${capStart - tipEnd}" height="124" rx="10" fill="url(#pBody${state.currentProblemId})" stroke="rgba(0,0,0,.10)" stroke-width="3"></rect>
        <rect x="${capStart}" y="28" width="${Math.max(72, lengthPx - capStart - 76)}" height="124" rx="10" fill="#f59e0b" stroke="rgba(0,0,0,.10)" stroke-width="3"></rect>

        <rect x="${lengthPx - 76}" y="28" width="76" height="124" rx="10" fill="#f3f4f6" stroke="rgba(0,0,0,.12)" stroke-width="3"></rect>
        <rect x="${lengthPx - 50}" y="28" width="50" height="124" rx="10" fill="#e5e7eb"></rect>
        <rect x="${Math.max(0, lengthPx - 16)}" y="28" width="16" height="124" rx="8" fill="#1f2937"></rect>

        <path d="M 145 42 C ${Math.max(180, lengthPx * 0.22)} 60, ${Math.max(180, lengthPx * 0.22)} 120, 145 138" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="10" stroke-linecap="round"></path>
        <text x="${Math.min(Math.max(lengthPx * 0.28, 240), lengthPx - 250)}" y="104" text-anchor="middle" font-size="64" font-weight="900" fill="#1f2937" opacity=".85">HB</text>
      </svg>
    `;
  }

  function randomLengthMm(type) {
    if (type === 'button') return 5;

    if (type === 'image') {
      const min = 35;
      const max = 180;
      let mm = min + Math.floor(Math.random() * (max - min + 1));
      if (Math.random() < 0.35) mm = Math.round(mm / 10) * 10;
      return mm;
    }

    if (type === 'pencil') {
      const min = 25;
      const max = 180;
      let mm = min + Math.floor(Math.random() * (max - min + 1));
      if (Math.random() < 0.34) mm = Math.round(mm / 10) * 10;
      return mm;
    }

    const min = 35;
    const max = 170;
    let mm = min + Math.floor(Math.random() * (max - min + 1));
    if (Math.random() < 0.28) mm = Math.round(mm / 10) * 10;
    return mm;
  }

  function buildObject(type, lengthMm) {
    const label = state._customLabel || formatObjectLabel(type);
    objectLabel.textContent = label;
    objectBody.innerHTML = buildObjectSvg(type, lengthMm);
  }

  function chooseRandomProblem() {
    const type = objectKinds[Math.floor(Math.random() * objectKinds.length)].key;
    setProblem(type, randomLengthMm(type), true);
  }

  function setProblem(type, lengthMm, randomizePosition = false, customLabel = null) {
    state.currentProblemId += 1;
    state.objectType = type;
    state.lengthMm = lengthMm;
    state.snapped = false;
    state.snapping = false;
    state.snapLocked = false;
    state.snapSuspended = false;
    state.measuring = false;
    state.overlayToken += 1;
    setResult('');

    // ラベルオーバーライド
    if (customLabel) state._customLabel = customLabel;
    else state._customLabel = null;

    buildObject(type, lengthMm);

    if (type !== 'image') {
      state.customImageVisual = null;
      state.customImageFit = null;
    } else {
      state.customImageVisual = { x: 0, y: 0, w: state.objectW, h: state.objectH };
    }

    const objectH = state.objectH;
    if (randomizePosition) {
      state.objectX = 650 + Math.floor(Math.random() * 230);
      state.objectY = type === 'button' ? 250 : (type === 'pencil' ? 240 : (type === 'image' ? 220 : 170));
    } else if (type === 'eraser') {
      state.objectX = 760;
      state.objectY = 170;
    } else if (type === 'pencil') {
      state.objectX = 760;
      state.objectY = 240;
    } else if (type === 'image') {
      state.objectX = 760;
      state.objectY = 220;
    } else {
      state.objectX = 760;
      state.objectY = 260;
    }

    objectWrap.style.left = `${state.objectX}px`;
    objectWrap.style.top = `${state.objectY}px`;
    objectWrap.style.width = `${state.objectW}px`;
    objectWrap.style.height = `${state.objectH}px`;

    state.rulerLeft = 220;
    state.rulerTop = state.objectY + objectH + 120;
    updateRulerPosition();
    updateCanvasSize();   // ← キャンバス高さとviewBoxをオブジェクトサイズに合わせて更新
    updateSurfaceStatus();
    clearOverlay();
    // showToastはapplyProblemByIdで上書きするのでここでは最小限に
  }

  function resetAll() {
    setProblem(state.objectType, state.lengthMm, false);
    showToast('最初の位置にもどしました', 1400);
  }

  function updateRulerPosition() {
    rulerWrap.style.left = `${state.rulerLeft}px`;
    rulerWrap.style.top = `${state.rulerTop}px`;
  }

  // objectWrap の stage-surface 座標系での実際の矩形を返す
  // ※ DOM layoutに依存せず state の値を直接使う（大きいオブジェクトでのスクロールズレを防ぐ）
  function getObjectSurfaceRect() {
    return {
      x: state.objectX,
      y: state.objectY,
      w: state.objectW,
      h: state.objectH,
    };
  }

  function snapTarget() {
    const r = getObjectSurfaceRect();
    return { x: r.x, y: r.y + r.h };
  }

  function trySnap(force = false) {
    if (state.measuring) return false;
    const target = snapTarget();
    const dist = Math.hypot(state.rulerLeft - target.x, state.rulerTop - target.y);
    const smallObjectBoost = state.objectType === 'image'
      ? Math.max(0, 160 - Math.min(state.objectW, state.objectH)) * 1.1
      : 0;
    const snapThreshold = force ? 999999 : (26 / state.zoom) + smallObjectBoost;
    if (dist <= snapThreshold) {
      state.rulerLeft = target.x;
      state.rulerTop = target.y;
      updateRulerPosition();
      state.snapped = true;
      state.snapLocked = true;
      updateSurfaceStatus();
      showHint('端と０を合わせたね！', 2600);
      showToast('ぴったりスナップしました！「測るアニメ開始」を押そう', 2000);
      speak('端とゼロを合わせたね');
      beep(880, 80);
      return true;
    }
    return false;
  }

  function clearOverlay() {
    measureOverlay.innerHTML = '';
  }

  function svgEl(tag, attrs = {}) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [key, value] of Object.entries(attrs)) {
      el.setAttribute(key, String(value));
    }
    return el;
  }

  function rectGrow(rect, targetWidth, duration = 560) {
    return new Promise(resolve => {
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        rect.setAttribute('width', String(targetWidth * ease));
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  function segmentLabelPosition(startX, endX, yBase, index, isMm) {
    const midX = (startX + endX) / 2;

    if (state.measureMode === 'mmOnly') {
      const oddLift = (index % 2 === 1) ? -36 : 0;
      return { x: midX, y: yBase - 28 + oddLift };
    }

    if (isMm) {
      return { x: midX, y: yBase - 28 };
    }

    return { x: midX, y: yBase - 44 };
  }

  function appendSegment(overlay, { startX, endX, yBase, color, label, index, isMm = false }) {
    const group = svgEl('g', { opacity: '0', style: 'transition:opacity .18s linear;' });
    const arcLift = isMm ? 30 : 38;
    const arcStroke = isMm ? 7 : 8;
    const dividerStroke = isMm ? 5 : 6;
    const dividerBottom = isMm ? 22 : 28;
    const labelSize = isMm ? 22 : 28;

    const path = svgEl('path', {
      d: `M ${startX} ${yBase} Q ${(startX + endX) / 2} ${yBase - arcLift} ${endX} ${yBase}`,
      fill: 'none',
      stroke: color,
      'stroke-width': arcStroke,
      'stroke-linecap': 'round'
    });

    const divider = svgEl('line', {
      x1: endX,
      y1: yBase - 2,
      x2: endX,
      y2: yBase + dividerBottom,
      stroke: color,
      'stroke-width': dividerStroke,
      'stroke-linecap': 'round'
    });

    const labelPos = segmentLabelPosition(startX, endX, yBase, index, isMm);
    const text = svgEl('text', {
      x: labelPos.x,
      y: labelPos.y,
      fill: color,
      'font-size': labelSize,
      'font-weight': '900',
      'text-anchor': 'middle',
      'dominant-baseline': 'middle',
      'paint-order': 'stroke',
      'stroke': 'rgba(255,255,255,.92)',
      'stroke-width': isMm ? '5' : '6',
      'stroke-linejoin': 'round'
    });
    text.textContent = String(label);

    group.appendChild(path);

    if (!isMm && label === 1) {
      const zeroLine = svgEl('line', {
        x1: startX,
        y1: yBase - 2,
        x2: startX,
        y2: yBase + dividerBottom,
        stroke: color,
        'stroke-width': dividerStroke,
        'stroke-linecap': 'round'
      });
      group.appendChild(zeroLine);
    }

    group.appendChild(divider);
    group.appendChild(text);
    overlay.appendChild(group);
    requestAnimationFrame(() => group.setAttribute('opacity', '1'));
  }

  async function animateMeasurement() {
    if (!state.snapped || state.measuring) return;
    state.measuring = true;
    state.overlayToken += 1;
    const myToken = state.overlayToken;
    clearOverlay();
    updateSurfaceStatus();

    // ── アニメ開始時点で座標・サイズを確定（DOM layoutに依存しない） ──
    // getObjectSurfaceRect() は state の値を返すので、スクロール・zoom変化の影響を受けない
    const objRect = getObjectSurfaceRect();
    const startX  = objRect.x;           // 固定：アニメ中に変わらない
    const startY  = objRect.y;
    const totalPx = objRect.w;           // 固定：アニメ中に変わらない
    const objH    = objRect.h;
    const target  = { x: startX, y: startY + objH };

    // 1mm あたりのピクセル数を state から確定（DOM依存なし）
    const pxPerMmReal = state.objectW / state.lengthMm;

    const yellowThickness = Math.max(pxPerMmReal * 10, 60);
    const yellowY = target.y - yellowThickness;
    const yellowRect = svgEl('rect', {
      x: target.x,
      y: yellowY,
      width: 0,
      height: yellowThickness,
      fill: '#facc15',
      opacity: '0.78'
    });
    measureOverlay.appendChild(yellowRect);

    speak('長さを数えてみよう');
    beep(560, 100, 'sine', 0.04);

    // 黄色バーの伸長時間を長さに応じて調整（大きいオブジェクトでも適切な速さに）
    const growDuration = Math.min(560, Math.max(300, totalPx * 0.18));
    await rectGrow(yellowRect, totalPx, growDuration);
    if (myToken !== state.overlayToken) return;

    // 黄色バー完了音
    beep(660, 80, 'sine', 0.03);

    const yBase = target.y - 22;
    let currentX = target.x;

    if (state.measureMode === 'mmOnly') {
      for (let i = 0; i < state.lengthMm; i++) {
        // ✅ tokenチェックは await の後に行う（awaitで中断した後に確認）
        await wait(90);
        if (myToken !== state.overlayToken) return;
        const nextX = currentX + pxPerMmReal;
        appendSegment(measureOverlay, {
          startX: currentX,
          endX: nextX,
          yBase,
          color: '#2563eb',
          label: i + 1,
          index: i + 1,
          isMm: true
        });
        beep(900 + i * 18, 55, 'triangle', 0.025);
        currentX = nextX;
      }
      await wait(180);
      if (myToken !== state.overlayToken) return;
      setResult(`<span class="mm">${state.lengthMm}mm</span> だね！`);
      speak(`${state.lengthMm}ミリだね`);
      beep(980, 100, 'triangle', 0.04);
    } else {
      const cmCount = Math.floor(state.lengthMm / 10);
      const remMm   = state.lengthMm % 10;

      for (let i = 0; i < cmCount; i++) {
        // ✅ tokenチェックは await の後に行う
        await wait(240);
        if (myToken !== state.overlayToken) return;
        const nextX = currentX + 10 * pxPerMmReal;
        appendSegment(measureOverlay, {
          startX: currentX,
          endX: nextX,
          yBase,
          color: '#ef4444',
          label: i + 1,
          index: i + 1,
          isMm: false
        });
        beep(700 + i * 55, 85, 'square', 0.04);
        currentX = nextX;
      }

      for (let i = 0; i < remMm; i++) {
        // ✅ tokenチェックは await の後に行う
        await wait(170);
        if (myToken !== state.overlayToken) return;
        const nextX = currentX + pxPerMmReal;
        appendSegment(measureOverlay, {
          startX: currentX,
          endX: nextX,
          yBase,
          color: '#2563eb',
          label: i + 1,
          index: i + 1,
          isMm: true
        });
        beep(900 + i * 35, 70, 'triangle', 0.035);
        currentX = nextX;
      }

      await wait(220);
      if (myToken !== state.overlayToken) return;
      setResult(`<span class="cm">${Math.floor(state.lengthMm / 10)}cm</span> <span class="mm">${state.lengthMm % 10}mm</span>（${state.lengthMm}ミリメートル）だね！`);
      speak(`${Math.floor(state.lengthMm / 10)}センチ${state.lengthMm % 10}ミリだね`);
      beep(980, 120, 'triangle', 0.05);
      beep(1240, 150, 'triangle', 0.05);
    }

    state.measuring = false;
    updateSurfaceStatus();
  }


  function objectPointerDown(e) {
    if (state.measuring) return;
    e.preventDefault();
    e.stopPropagation();

    state.objectDragging = true;
    objectWrap.classList.add('dragging');
    state.objectDragPointerId = e.pointerId;
    try { objectWrap.setPointerCapture(state.objectDragPointerId); } catch (_) {}

    if (state.snapped || state.snapLocked) {
      state.snapped = false;
      state.snapLocked = false;
      state.snapSuspended = true;
      updateSurfaceStatus();
    }

    state.objectDragStartClientX = e.clientX;
    state.objectDragStartClientY = e.clientY;
    state.objectDragStartLeft = state.objectX;
    state.objectDragStartTop = state.objectY;
  }

  function objectPointerMove(e) {
    if (!state.objectDragging || state.measuring) return;

    const dx = (e.clientX - state.objectDragStartClientX) / state.zoom;
    const dy = (e.clientY - state.objectDragStartClientY) / state.zoom;

    state.objectX = state.objectDragStartLeft + dx;
    state.objectY = state.objectDragStartTop + dy;

    objectWrap.style.left = `${state.objectX}px`;
    objectWrap.style.top = `${state.objectY}px`;

    if (state.snapSuspended) {
      state.snapped = false;
      state.snapLocked = false;
    }
  }

  function objectPointerUp() {
    state.objectDragging = false;
    objectWrap.classList.remove('dragging');
    if (state.objectDragPointerId !== null) {
      try { objectWrap.releasePointerCapture(state.objectDragPointerId); } catch (_) {}
    }
    state.objectDragPointerId = null;

    if (state.snapSuspended) {
      state.snapSuspended = false;
      trySnap(false);
    }
  }

  function pointerDown(e) {
    if (state.measuring) return;
    state.dragging = true;
    rulerWrap.classList.add('dragging');
    state.dragPointerId = e.pointerId;
    try { rulerWrap.setPointerCapture(state.dragPointerId); } catch (_) {}

    if (state.snapLocked || state.snapped) {
      state.snapLocked = false;
      state.snapped = false;
      state.snapSuspended = true;
      updateSurfaceStatus();
    }

    state.dragStartClientX = e.clientX;
    state.dragStartClientY = e.clientY;
    state.dragStartLeft = state.rulerLeft;
    state.dragStartTop = state.rulerTop;
  }

  
  function pointerMove(e) {
    if (!state.dragging || state.measuring) return;

    const dx = (e.clientX - state.dragStartClientX) / state.zoom;
    const dy = (e.clientY - state.dragStartClientY) / state.zoom;

    state.rulerLeft = state.dragStartLeft + dx;
    state.rulerTop = state.dragStartTop + dy;

    state.snapLocked = false;
    state.snapped = false;

    updateRulerPosition();

    if (!state.snapSuspended) {
      trySnap(false);
    }
  }


  function pointerUp() {
    state.dragging = false;
    rulerWrap.classList.remove('dragging');
    if (state.dragPointerId !== null) {
      try { rulerWrap.releasePointerCapture(state.dragPointerId); } catch (_) {}
    }
    state.dragPointerId = null;

    if (state.snapSuspended) {
      state.snapSuspended = false;
      trySnap(false);
    }
  }

  function changeZoom(nextZoom) {
    const clamped = Math.max(0.14, Math.min(0.5, nextZoom));
    state.zoom = Math.round(clamped * 100) / 100;
    updateZoomUI();
    updateCanvasSize();
    updateSurfaceStatus();
  }

  function randomProblem() {
    const type = objectKinds[Math.floor(Math.random() * objectKinds.length)].key;
    setProblem(type, randomLengthMm(type), true);
  }

  async function loadCustomImageFile(file) {
    return preprocessImageFile(file);
  }

  if (imageLoadBtn && imageInput) {
    imageLoadBtn.addEventListener('click', () => imageInput.click());

    imageInput.addEventListener('change', async () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;

      try {
        const loaded = await loadCustomImageFile(file);
        state.customImageSrc = loaded.src;
        state.customImageRatio = loaded.ratio || (loaded.height / loaded.width);
        setProblem('image', randomLengthMm('image'), true);
        trySnap(false);
        showToast('画像を読み込みました。余白を落として使います。', 2000);
      } catch (err) {
        console.error(err);
        showToast('画像の読み込みに失敗しました。別の画像で試してください。', 2200);
      } finally {
        imageInput.value = '';
      }
    });
  }

  const loadFolderBtn = document.getElementById('loadFolderBtn');
  if (loadFolderBtn) {
    loadFolderBtn.addEventListener('click', async () => {
      loadFolderBtn.disabled = true;
      loadFolderBtn.textContent = '📂 読み込み中…';
      showToast('フォルダを選択してください。PNG画像を読み込みます…', 3000);
      const ok = await loadFolderPngs();
      loadFolderBtn.disabled = false;
      if (ok && pngFileList.length > 0) {
        loadFolderBtn.textContent = `📁 PNG ${pngFileList.length}枚読込済`;
        showToast(`✅ PNG ${pngFileList.length}枚を読み込みました！問題ID4〜${maxProblemId()}に追加されました。`, 3000);
      } else if (ok && pngFileList.length === 0) {
        loadFolderBtn.textContent = '📁 PNGフォルダ読み込み';
        showToast('フォルダ内にPNGファイルが見つかりませんでした。', 2400);
      } else {
        loadFolderBtn.textContent = '📁 PNGフォルダ読み込み';
        showToast('読み込みをキャンセルしました。または対応していないブラウザです。', 2400);
      }
    });
  }

  // デバッグパネルのトグル
  const debugBtn = document.getElementById('debugBtn');
  const debugPanel = document.getElementById('debugPanel');
  if (debugBtn && debugPanel) {
    debugBtn.addEventListener('click', () => {
      const on = debugPanel.classList.toggle('visible');
      debugBtn.classList.toggle('active', on);
      debugBtn.textContent = on ? '🔧 DEBUG ON' : '🔧 DEBUG';
    });
  }

  rulerWrap.addEventListener('pointerdown', pointerDown);
  objectWrap.addEventListener('pointerdown', objectPointerDown);
  window.addEventListener('pointermove', (e) => {
    pointerMove(e);
    objectPointerMove(e);
  });
  window.addEventListener('pointerup', (e) => {
    pointerUp(e);
    objectPointerUp(e);
  });
  window.addEventListener('pointercancel', (e) => {
    pointerUp(e);
    objectPointerUp(e);
  });

  hintToggle.addEventListener('change', applyHintToggle);

  newProblemBtn.addEventListener('click', () => {
    advanceToNextProblem();
  });

  if (modeBtn) {
    modeBtn.addEventListener('click', () => {
      state.measureMode = state.measureMode === 'normal' ? 'mmOnly' : 'normal';
      modeBtn.textContent = state.measureMode === 'normal'
        ? '通常測定モード'
        : 'mmだけ測定モード';
      showToast(
        state.measureMode === 'normal'
          ? 'cmとmmで測るモードです'
          : 'mmだけで測るモードです',
        1800
      );
    });
  }

  if (rerollPencilBtn) {
    rerollPencilBtn.addEventListener('click', () => {
      // 問題IDに影響しない独立処理
      state._customLabel = null;
      setProblem('pencil', randomLengthMm('pencil'), true);
      // バッジは変えない（問題IDシステム外）
      showToast('🖊 鉛筆の長さをランダムで再生成しました（問題IDはそのままです）', 1800);
    });
  }

  resetBtn.addEventListener('click', resetAll);

  zoomOutBtn.addEventListener('click', () => changeZoom(state.zoom - 0.05));
  zoomInBtn.addEventListener('click', () => changeZoom(state.zoom + 0.05));
  zoomResetBtn.addEventListener('click', () => changeZoom(0.2));

  measureBtn.addEventListener('click', () => {
    if (!state.snapped) {
      trySnap(false);
    }
    if (!state.snapped) {
      showToast('先に物差しの左はし（0）を、対象物の左下に合わせてね', 2200);
      speak('先に端とゼロを合わせよう');
      return;
    }
    animateMeasurement();
  });

  function refreshSoundButton() {
    soundBtn.classList.toggle('sound-on', state.audioEnabled);
    soundBtn.classList.toggle('sound-off', !state.audioEnabled);
    soundBtn.textContent = '🔊';
    soundBtn.setAttribute('aria-label', state.audioEnabled ? '音声オン' : '音声オフ');
  }

  soundBtn.addEventListener('click', () => {
    state.audioEnabled = !state.audioEnabled;
    refreshSoundButton();
    showToast(state.audioEnabled ? '音声をONにしました' : '音声をOFFにしました', 1600);
    if (state.audioEnabled) {
      const ctx = audio.ensure();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
      speak('音声をオンにしました');
      beep(720, 80, 'sine', 0.04);
    }
  });

  updateZoomUI();
  buildRulerSvg();
  if (typeof refreshSoundButton === 'function') refreshSoundButton();

  // 起動時：直書きPNGを自動fetch → その後ID1からスタート
  currentProblemIndex = 0;
  updateProblemIdBadge(1);
  setProblem('eraser', 40, false, '消しゴム');  // ← setProblem内でupdateCanvasSizeが呼ばれる
  updateRulerPosition();
  updateSurfaceStatus();

  preloadBuiltinPngs().then(count => {
    if (count > 0) {
      showToast(`✅ PNG ${count}枚を読み込みました。問題ID4〜${maxProblemId()}に追加されました。`, 3000);
    } else {
      showToast('「次の問題」で問題ID順に進みます。', 2200);
    }
  });
})();
</script>

</body>
</html>
